# Model download manifest
# SOURCE OF TRUTH for model URLs, checksums, and RAM requirements.
# Written once and read by download_models.py at first run.
# The models/manifest.json file tracks which models are actually present.
# Do not hardcode URLs in application code — read from here.

models:
  # ── STT ────────────────────────────────────────────────────────────────────

  - id: whisper_base_en
    name: "whisper.cpp base.en"
    tier: bundled              # Ships in installer — no download required
    destination: models/stt/whisper-base-en.bin
    url: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
    sha256: 60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe
    size_mb: 142
    ram_mb: 300
    license: MIT
    platform: [windows, linux, macos, android, ios]

  - id: faster_whisper_turbo
    name: "faster-whisper large-v3 turbo int8"
    tier: recommended
    destination: models/stt/faster-whisper-large-v3-turbo
    url: https://huggingface.co/Systran/faster-whisper-large-v3-turbo/resolve/main/
    sha256: null               # Directory model — verify via manifest.json after download
    size_mb: 1500
    ram_mb: 3072
    license: MIT
    platform: [windows, linux, macos]
    files:
      - model.bin
      - config.json
      - tokenizer.json
      - vocabulary.txt
      - preprocessor_config.json

  - id: moonshine_v2_base
    name: "Moonshine v2 Base"
